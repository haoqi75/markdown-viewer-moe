name: Build and deploy to Codeberg Pages
# 除了第40行，其他不要改。

on:
  # 对推送至默认分支的操作运行
  push:
    branches: ["main"]
  
  # 允许您从“操作”选项卡手动运行此工作流程。
  workflow_dispatch:

# 这个就是Permissions
enable-openid-connect: true   # 需要推送至 pages 分支

jobs:
  deploy:
    # 由于我们只是进行部署，所以只执行一次部署任务。
    runs-on: codeberg-small  # 这个就是 ubuntu-latest，small就可以运行了
    name: Build and deploy to Codeberg Pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 为了兼容性，还是使用 Forgejo 带的 Action
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: true
          cache: true

      - name: Run tests
        run: pnpm test

      - name: Publish test summary
        if: always()
        run: |
          SUMMARY="${GITHUB_STEP_SUMMARY:-${FORGEJO_STEP_SUMMARY:-}}"
          if [ -z "$SUMMARY" ]; then
            echo "Step summary is not available on this runner"
            exit 0
          fi
          {
            echo "## 🧪 Test results"
            echo ""
            if [ -f validation.txt ]; then
              cat validation.txt
            else
              echo "validation.txt was not generated."
            fi
          } >> "$SUMMARY"

      - name: Build page and tools
        id: build
        run: pnpm run build

      - name: Publish build summary
        if: always()
        run: |
          SUMMARY="${GITHUB_STEP_SUMMARY:-${FORGEJO_STEP_SUMMARY:-}}"
          if [ -z "$SUMMARY" ]; then
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo unknown)
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
          {
            echo "## 📦 Build result"
            echo ""
            echo "- Version: \`$VERSION\`"
            echo "- Commit: \`$COMMIT\`"
            echo "- Status: \`${{ steps.build.outcome }}\`"
            echo ""
            if [ "${{ steps.build.outcome }}" = "success" ] && [ -d dist ]; then
              echo "| File | Size |"
              echo "| --- | --- |"
              find dist -maxdepth 1 -type f -printf '| `%f` | %s bytes |\n' | sort
            else
              echo "_dist/ 未生成或构建未成功_"
            fi
          } >> "$SUMMARY"

      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          # 上传仅dist文件夹的文件
          source: ./dist
          # 你的域名 或者可以使用 https://${{ forge.repository_owner }}.codeberg.page/markdown-viewer-moe/
          site: https://moe520.os.kg
          # 使用 https://${{ forge.repository_owner }}.codeberg.page/markdown-viewer-moe/ 可以去掉这一行
          server: codeberg.page
          token: ${{ forge.token }}
