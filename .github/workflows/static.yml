name: Build and deploy to Github Pages
# 注意，GitHub Pages 在设置配置，因此你无需编辑这个文件

on:
  # 对推送至默认分支的操作运行
  push:
    branches: ["main"]

  # 允许您从“操作”选项卡手动运行此工作流程。
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages。
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署，跳过正在进行的运行和最新排队的运行之间的排队运行。
# 但是，请勿取消正在进行的运行，因为我们希望这些生产部署能够完成。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 由于我们只是进行部署，所以只执行一次部署任务。
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    name: Build and deploy to Github Pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup pnpm, Node.js and install Dependencies
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Run tests
        run: pnpm test

      - name: Publish test summary
        if: always()
        run: |
          SUMMARY="${GITHUB_STEP_SUMMARY:-${FORGEJO_STEP_SUMMARY:-}}"
          if [ -z "$SUMMARY" ]; then
            echo "Step summary is not available on this runner"
            exit 0
          fi
          {
            echo "## 🧪 Test results"
            echo ""
            if [ -f validation.txt ]; then
              cat validation.txt
            else
              echo "validation.txt was not generated."
            fi
          } >> "$SUMMARY"

      - name: Build page and tools
        id: build
        run: pnpm run build

      - name: Publish build summary
        if: always()
        run: |
          SUMMARY="${GITHUB_STEP_SUMMARY:-${FORGEJO_STEP_SUMMARY:-}}"
          if [ -z "$SUMMARY" ]; then
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo unknown)
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
          {
            echo "## 📦 Build result"
            echo ""
            echo "- Version: \`$VERSION\`"
            echo "- Commit: \`$COMMIT\`"
            echo "- Status: \`${{ steps.build.outcome }}\`"
            echo ""
            if [ "${{ steps.build.outcome }}" = "success" ] && [ -d dist ]; then
              echo "| File | Size |"
              echo "| --- | --- |"
              find dist -maxdepth 1 -type f -printf '| `%f` | %s bytes |\n' | sort
            else
              echo "_dist/ 未生成或构建未成功_"
            fi
          } >> "$SUMMARY"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上传仅dist文件夹的文件
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
