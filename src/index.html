<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff6b9d">
    <title>🌸 萌·Markdown 预览器</title>

    <!-- ====== 网站图标 ====== -->
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="alternate icon" href="img/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="img/site.webmanifest">

    <!-- 外部依赖 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

    <script>
        try {
            var savedColorMode = localStorage.getItem('moe:color-mode');
            if (savedColorMode === 'dark' || savedColorMode === 'light') {
                document.documentElement.setAttribute('data-color-mode', savedColorMode);
            }
        } catch (e) {}
    </script>

    <config-placeholder></config-placeholder>
    <link rel="stylesheet" href="style.scss">
    <!-- head-inject: config.headInject 内容注入到此（</head> 之前） -->
    <head-inject></head-inject>
</head>
<body>
    <!-- 浮动装饰 -->
    <div class="moe-deco" aria-hidden="true">🌸</div>
    <div class="moe-deco" aria-hidden="true">⭐</div>
    <div class="moe-deco" aria-hidden="true">💖</div>
    <div class="moe-deco" aria-hidden="true">✨</div>

    <div id="toc-overlay" class="toc-overlay"></div>

    <aside id="toc-sidebar" class="toc-sidebar" role="navigation" aria-label="文档目录">
        <div class="toc-header">
            <h3>📋 大纲 <span id="toc-count">0</span></h3>
            <button class="toc-close" id="toc-close-btn" aria-label="关闭目录">✕</button>
        </div>
        <div class="toc-header-deco">
            <img src="sit-down-placeholder" alt="">
            <span class="toc-bubble" id="toc-bubble"></span>
        </div>
        <div id="toc-content">
            <div class="toc-empty">🌸 暂无标题</div>
        </div>
    </aside>

    <main class="card" role="main">
        <div class="header">
            <div class="header-left">
                <img id="logo-img" src="logo-placeholder" alt="Logo" class="logo-img">
                <span class="logo">📝 萌·Markdown</span>
                <span class="logo-sub">Moe Preview</span>
            </div>
            <button id="toc-toggle" class="toc-toggle" aria-label="切换目录">
                📑 大纲 <span class="badge" id="toc-badge">0</span>
            </button>
            <a href="https://github.com/haoqi75/markdown-viewer-moe" target="_blank" rel="noopener" class="github-link" title="GitHub 仓库" aria-label="GitHub 仓库">

            </a>
            <button type="button" class="github-link raw-copy-link" id="raw-copy-link" data-raw-copy title="复制当前文档 RAW 链接" aria-label="复制当前文档 RAW 链接" hidden>
                <svg class="github-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
            <button type="button" class="github-link color-mode-toggle" data-color-mode-toggle title="切换到深色模式" aria-label="切换到深色模式" aria-pressed="false">
                <svg class="github-icon color-mode-icon color-mode-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg class="github-icon color-mode-icon color-mode-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
            </button>
            <a href="?p=about" class="github-link about-link" id="about-link" title="关于本站" aria-label="关于本站">
                <svg class="github-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            </a>
            <a href="https://docs.moe520.cc.cd/" target="_blank" rel="noopener" class="github-link" title="文档" aria-label="文档">
                <svg class="github-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1v5h5M8 13h8v2H8zm0 4h8v2H8zm0-8h3v2H8z"/></svg>
            </a>
            <a href="https://moe520.haoqi75.os.kg/tools.html" target="_blank" rel="noopener" class="github-link" id="tools-link" data-tools-link title="JSON 编辑器" aria-label="JSON 编辑器">
                <svg class="github-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h4v2H7v14h2v2H5V3zm14 0h-4v2h2v14h-2v2h4V3zM8.5 8.5l1.5 1.5-1.5 1.5L10 13l3-3-3-3-1.5 1.5zm7 0L14 10l1.5 1.5L14 13l3-3-3-3-1.5 1.5z"/></svg>
            </a>
            <div class="header-more">
                <button type="button" class="github-link mobile-menu-toggle" id="mobile-menu-toggle" aria-label="更多操作" aria-haspopup="true" aria-expanded="false" aria-controls="mobile-menu" title="更多操作">
                    <span aria-hidden="true">⋯</span>
                </button>
                <div class="mobile-menu" id="mobile-menu" role="menu" hidden>
                    <button type="button" class="mobile-menu-item" data-raw-copy role="menuitem">
                        <svg class="mobile-menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        <span>复制 RAW 链接</span>
                    </button>
                    <button type="button" class="mobile-menu-item" data-color-mode-toggle role="menuitem" title="切换到深色模式" aria-label="切换到深色模式" aria-pressed="false">
                        <svg class="mobile-menu-icon color-mode-icon color-mode-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                        <svg class="mobile-menu-icon color-mode-icon color-mode-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
                        <span data-color-mode-label>深色模式</span>
                    </button>
                    <a href="https://github.com/haoqi75/markdown-viewer-moe" target="_blank" rel="noopener" class="mobile-menu-item" role="menuitem">
                        <svg class="mobile-menu-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                        <span>GitHub</span>
                    </a>
                    <a href="?p=about" class="mobile-menu-item" role="menuitem">
                        <svg class="mobile-menu-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                        <span>关于本站</span>
                    </a>
                    <a href="https://docs.moe520.cc.cd/" target="_blank" rel="noopener" class="mobile-menu-item" role="menuitem">
                        <svg class="mobile-menu-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1v5h5M8 13h8v2H8zm0 4h8v2H8zm0-8h3v2H8z"/></svg>
                        <span>使用文档</span>
                    </a>
                    <a href="https://moe520.haoqi75.os.kg/tools.html" target="_blank" rel="noopener" class="mobile-menu-item" data-tools-link role="menuitem">
                        <svg class="mobile-menu-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h4v2H7v14h2v2H5V3zm14 0h-4v2h2v14h-2v2h4V3zM8.5 8.5l1.5 1.5-1.5 1.5L10 13l3-3-3-3-1.5 1.5zm7 0L14 10l1.5 1.5L14 13l3-3-3-3-1.5 1.5z"/></svg>
                        <span>JSON 编辑器</span>
                    </a>
                </div>
            </div>
        </div>
        <div id="content">
            <div class="loading-wrap">
                <div class="spinner"></div>
                <p>🌸 正在加载文档...</p>
            </div>
        </div>
        
        <!-- 页脚（放在卡片内部） -->
        <footer id="footer" class="footer"></footer>
    </main>
    
    <!-- 右下角吉祥物（在卡片外，固定定位） -->
    <div id="mascot" class="mascot">
        <img id="mascot-img" src="mascot-placeholder" alt="Mascot">
    </div>

    <!-- 关于页内容（gulp 从 src/about.html 提取并内嵌，?p=about 时渲染） -->
    <about-page-template></about-page-template>

    <script src="main.js"></script>
    <!-- body-inject: config.bodyInject 内容注入到此（</body> 之前） -->
    <body-inject></body-inject>
</body>
</html>
